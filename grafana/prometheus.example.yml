# Prometheus scrape config — exemplo para monitorar o Bot-WPP (metricsService porta 3001)
# Uso: prometheus --config.file=prometheus.example.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bot-wpp'
    static_configs:
      - targets: ['127.0.0.1:3001']
    metrics_path: /metrics
