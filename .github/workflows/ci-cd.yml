name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ⚠️ DEPLOY REMOVIDO DESTE WORKFLOW (2026-08-13):
# O deploy SSH (appleboy/ssh-action) falha com "dial tcp ***:22: i/o timeout"
# porque o SERVER_IP é o IP do Tailscale (100.x), inalcançável pelo runner do GitHub
# (nuvem, fora da Tailscale network). O sync Linux é feito manualmente via Hermes
# (SSH pela Tailscale) após cada push.
# PARA REATIVAR DEPLOY AUTOMÁTICO no futuro: instalar um GitHub Self-Hosted Runner
# DENTRO do servidor Linux (que está na Tailscale) — assim o runner é o próprio
# servidor e o deploy roda localmente, sem SSH pela nuvem. Veja:
# Settings > Actions > Runners > New self-hosted runner.

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Build project
      run: npm run build
