<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Diagnóstico Completo</title>
  <style>
    body { background: #1a1a2e; color: #eee; font-family: monospace; padding: 20px; }
    .log { background: #16213e; padding: 15px; border-radius: 8px; margin: 10px 0; max-height: 400px; overflow-y: auto; }
    .ok { color: #4ecca3; }
    .error { color: #e74c3c; }
    .warn { color: #f39c12; }
    button { background: #0f3460; color: #eee; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; font-size: 16px; }
    button:hover { background: #1a5276; }
    h1 { color: #4ecca3; }
    .step { background: #0f3460; padding: 10px; margin: 5px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🔍 Diagnóstico Completo do Screen Share</h1>
  <button onclick="runFullDiagnostic()">🚀 Iniciar Diagnóstico Completo</button>
  <button onclick="clearLog()">Limpar</button>
  <div id="log" class="log"></div>

  <script>
    const log = document.getElementById('log');
    let logs = [];
    
    function add(msg, type = 'info') {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = type;
      div.textContent = `[${time}] ${msg}`;
      log.appendChild(div);
      logs.push({time, msg, type});
      console.log(`[${type}] ${msg}`);
      log.scrollTop = log.scrollHeight;
    }
    
    function clearLog() { log.innerHTML = ''; logs = []; }
    
    async function runFullDiagnostic() {
      clearLog();
      add('=== DIAGNÓSTICO COMPLETO ===', 'ok');
      
      // Step 1: Verificar APIs
      add('\n📋 Step 1: Verificando APIs do navegador...');
      const apis = {
        'VideoEncoder': typeof window.VideoEncoder !== 'undefined',
        'VideoFrame': typeof window.VideoFrame !== 'undefined',
        'EncodedVideoChunk': typeof window.EncodedVideoChunk !== 'undefined',
        'MediaStreamTrackProcessor': typeof window.MediaStreamTrackProcessor !== 'undefined',
        'getDisplayMedia': !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia),
        'WebSocket': typeof window.WebSocket !== 'undefined'
      };
      
      let allOk = true;
      for (const [name, exists] of Object.entries(apis)) {
        add(`  ${name}: ${exists ? '✅' : '❌'}`, exists ? 'ok' : 'error');
        if (!exists) allOk = false;
      }
      
      if (!allOk) {
        add('❌ Algumas APIs não estão disponíveis!', 'error');
        add('Use Chrome, Edge ou Brave no desktop.', 'warn');
        return;
      }
      
      // Step 2: Verificar codec support
      add('\n📋 Step 2: Verificando suporte a codecs...');
      const codecs = [
        { codec: 'vp8', width: 1920, height: 1080, bitrate: 5000000, framerate: 30 },
        { codec: 'vp8', width: 1280, height: 720, bitrate: 2500000, framerate: 30 },
        { codec: 'avc1.42e01e', width: 1280, height: 720, bitrate: 2500000, framerate: 30 }
      ];
      
      for (const cfg of codecs) {
        try {
          const result = await VideoEncoder.isConfigSupported(cfg);
          add(`  ${cfg.codec} ${cfg.width}x${cfg.height}: ${result.supported ? '✅' : '❌'}`, result.supported ? 'ok' : 'warn');
        } catch (err) {
          add(`  ${cfg.codec}: ❌ ${err.message}`, 'error');
        }
      }
      
      // Step 3: Testar WebSocket
      add('\n📋 Step 3: Testando conexão WebSocket...');
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${proto}://${location.host}`;
      add(`  URL: ${wsUrl}`);
      
      await new Promise((resolve) => {
        try {
          const ws = new WebSocket(wsUrl);
          const timeout = setTimeout(() => {
            add('  ❌ Timeout na conexão (10s)', 'error');
            ws.close();
            resolve();
          }, 10000);
          
          ws.onopen = () => {
            add('  ✅ WebSocket conectou!', 'ok');
            clearTimeout(timeout);
            setTimeout(() => { ws.close(); resolve(); }, 1000);
          };
          
          ws.onerror = () => {
            add('  ❌ Erro no WebSocket', 'error');
            clearTimeout(timeout);
            resolve();
          };
          
          ws.onclose = (e) => {
            add(`  WebSocket fechado: code=${e.code}`, e.code === 1000 ? 'ok' : 'warn');
            clearTimeout(timeout);
            resolve();
          };
        } catch (err) {
          add(`  ❌ Exceção: ${err.message}`, 'error');
          resolve();
        }
      });
      
      // Step 4: Testar getDisplayMedia
      add('\n📋 Step 4: Testando captura de tela...');
      add('  Vou pedir para selecionar uma tela...');
      
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 },
          audio: false
        });
        
        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings();
        add(`  ✅ Stream obtido: ${settings.width}x${settings.height} @ ${settings.frameRate}fps`, 'ok');
        add(`  Display surface: ${settings.displaySurface}`);
        
        // Step 5: Testar MediaStreamTrackProcessor
        add('\n📋 Step 5: Testando MediaStreamTrackProcessor...');
        const processor = new MediaStreamTrackProcessor({ track });
        const reader = processor.readable.getReader();
        add('  ✅ Processor criado!', 'ok');
        
        add('  Lendo frames...');
        let frameCount = 0;
        const readFrames = async () => {
          try {
            const result = await Promise.race([
              reader.read(),
              new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
            ]);
            
            if (result.value) {
              frameCount++;
              add(`  ✅ Frame ${frameCount}: ${result.value.displayWidth}x${result.value.displayHeight}`, 'ok');
              result.value.close();
              
              if (frameCount < 3) {
                return readFrames();
              }
            }
          } catch (err) {
            if (err.message === 'timeout') {
              add('  ⚠️ Timeout lendo frame (normal se a tela não mudou)', 'warn');
            } else {
              add(`  ❌ Erro: ${err.message}`, 'error');
            }
          }
        };
        
        await readFrames();
        reader.cancel();
        
        // Step 6: Testar VideoEncoder com frames reais
        add('\n📋 Step 6: Testando VideoEncoder com frames reais...');
        
        const cfg = { codec: 'vp8', width: settings.width, height: settings.height, bitrate: 5000000, framerate: 30 };
        const encoder = new VideoEncoder({
          output: (chunk) => {
            add(`  ✅ Chunk gerado: ${chunk.type}, ${chunk.byteLength} bytes`, 'ok');
          },
          error: (err) => {
            add(`  ❌ Erro no encoder: ${err.message}`, 'error');
          }
        });
        
        encoder.configure(cfg);
        add('  ✅ Encoder configurado!', 'ok');
        
        // Ler mais frames e codificar
        const reader2 = processor.readable.getReader();
        let encodedFrames = 0;
        
        for (let i = 0; i < 5; i++) {
          try {
            const result = await Promise.race([
              reader2.read(),
              new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 3000))
            ]);
            
            if (result.value) {
              const frame = result.value;
              try {
                encoder.encode(frame, { keyFrame: i === 0 });
                encodedFrames++;
                add(`  ✅ Frame ${i+1} codificado`, 'ok');
              } catch (err) {
                add(`  ❌ Erro ao codificar frame ${i+1}: ${err.message}`, 'error');
              }
              frame.close();
            }
          } catch (err) {
            add(`  ⚠️ Não leu mais frames: ${err.message}`, 'warn');
            break;
          }
        }
        
        encoder.close();
        reader2.cancel();
        
        add(`\n✅ Teste concluído! ${encodedFrames} frames codificados.`, 'ok');
        
        stream.getTracks().forEach(t => t.stop());
        
      } catch (err) {
        add(`  ❌ Erro: ${err.name} - ${err.message}`, 'error');
      }
      
      add('\n=== FIM DO DIAGNÓSTICO ===', 'ok');
    }
    
    add('Clique em "Iniciar Diagnóstico Completo" para começar', 'info');
  </script>
</body>
</html>
