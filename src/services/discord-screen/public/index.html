<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolanoJr Screen Share</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; margin: 0; }
    .card { background: #16213e; border-radius: 12px; padding: 32px; max-width: 600px; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { color: #4ecca3; margin-top: 0; text-align: center; }
    .status { padding: 12px; border-radius: 8px; margin: 16px 0; background: #0f3460; text-align: center; }
    .btn { background: #0f3460; color: #eee; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin: 8px 0; }
    .btn:hover { background: #1a5276; }
    .btn:disabled { background: #333; cursor: not-allowed; }
    .btn-stop { background: #e74c3c; }
    .btn-stop:hover { background: #c0392b; }
    .btn-discord { background: #5865F2; }
    .btn-discord:hover { background: #4752C4; }
    video { width: 100%; border-radius: 8px; margin: 16px 0; background: #000; }
    .ok { color: #4ecca3; }
    .error { color: #e74c3c; }
    .info { color: #74c0fc; }
    #logs { background: #000; padding: 10px; border-radius: 4px; max-height: 120px; overflow-y: auto; font-size: 11px; margin-top: 10px; font-family: monospace; }
    #viewerCount { font-size: 20px; font-weight: bold; margin: 15px 0; padding: 15px; border-radius: 8px; background: #0f3460; text-align: center; }
    .online { color: #4ecca3; }
    .offline { color: #e74c3c; }
    .mode-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-left: 10px; }
    .mode-discord { background: #5865F2; }
    .mode-browser { background: #f39c12; }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      🖥️ SolanoJr Screen Share
      <span id="modeBadge" class="mode-badge mode-browser">Navegador</span>
    </h1>
    <div id="status" class="status info">Conectando...</div>
    <div id="viewerCount" class="offline">🔴 Sem conexão</div>
    <button id="startBtn" class="btn btn-discord" onclick="startShare()">▶️ Iniciar transmissão</button>
    <button id="stopBtn" class="btn btn-stop" style="display:none" onclick="stopShare()">⏹️ Parar</button>
    <video id="preview" autoplay muted playsinline></video>
    <div id="logs"></div>
    <div id="stats" style="margin-top:15px; font-size:12px; color:#888; text-align:center;"></div>
  </div>

  <script>
    const logs = document.getElementById('logs');
    const statusEl = document.getElementById('status');
    const viewerCountEl = document.getElementById('viewerCount');
    const modeBadge = document.getElementById('modeBadge');
    let ws = null;
    let mr = null;
    let stream = null;
    let viewerCount = 0;
    
    // Detectar se está no Discord
    const params = new URLSearchParams(location.search);
    const inDiscord = params.has('frame_id') || params.has('instance_id');
    if (inDiscord) {
      modeBadge.textContent = 'Discord Activity';
      modeBadge.className = 'mode-badge mode-discord';
    }
    
    function log(msg) {
      const d = document.createElement('div');
      d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      logs.appendChild(d);
      logs.scrollTop = logs.scrollHeight;
    }
    
    async function startShare() {
      try {
        log('🎥 Obtendo stream de tela...');
        stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false });
        document.getElementById('preview').srcObject = stream;
        log('✅ Stream obtido!');
        
        const token = new URLSearchParams(location.search).get('t');
        if (!token) {
          log('❌ ERRO: Token não encontrado!');
          statusEl.textContent = 'Erro: Token não encontrado na URL';
          statusEl.className = 'status error';
          return;
        }
        
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = proto + '://' + location.host + '/ws?t=' + encodeURIComponent(token) + '&fonte=tela';
        log('🔗 Conectando: ' + wsUrl);
        
        ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';
        
        ws.onopen = () => {
          log('✅ WebSocket conectado!');
          statusEl.textContent = '🟢 Conectado - transmitindo';
          statusEl.className = 'status ok';
          ws.send(JSON.stringify({type:'config',config:{codec:'vp8',width:1920,height:1080,bitrate:5000000,framerate:30}}));
          ws.send(JSON.stringify({type:'start'}));
          log('🚀 Transmissão iniciada!');
          document.getElementById('startBtn').style.display = 'none';
          document.getElementById('stopBtn').style.display = 'block';
        };
        
        ws.onmessage = (e) => {
          if (typeof e.data === 'string') {
            const msg = JSON.parse(e.data);
            log('📨 ' + msg.type);
            if (msg.type === 'state') {
              viewerCount = msg.viewers || 0;
              updateViewerCount(msg.broadcasting);
            }
          }
        };
        
        ws.onerror = () => { log('❌ Erro no WebSocket'); };
        ws.onclose = () => { 
          log('🔌 WebSocket fechado'); 
          statusEl.textContent = '🔴 Desconectado';
          statusEl.className = 'status error';
          updateViewerCount(false);
        };
        
        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm;codecs=vp8';
        mr = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5000000 });
        mr.ondataavailable = (e) => { if (e.data.size > 0 && ws?.readyState === WebSocket.OPEN) { e.data.arrayBuffer().then(buf => ws.send(buf)); } };
        mr.start(100);
        log('🎬 MediaRecorder iniciado');
        
      } catch (err) {
        log('❌ ERRO: ' + err.message);
        statusEl.textContent = 'Erro: ' + err.message;
        statusEl.className = 'status error';
      }
    }
    
    function updateViewerCount(broadcasting) {
      if (viewerCount > 0) {
        viewerCountEl.className = 'online';
        viewerCountEl.textContent = '🟢 ' + viewerCount + ' pessoa(s) assistindo';
      } else if (broadcasting) {
        viewerCountEl.className = 'info';
        viewerCountEl.textContent = '🟡 Transmitindo - aguardando viewers';
      } else {
        viewerCountEl.className = 'offline';
        viewerCountEl.textContent = '🔴 Sem conexão';
      }
      document.getElementById('stats').textContent = 'Modo: ' + (inDiscord ? 'Discord Activity' : 'Navegador') + ' | Token: ' + (new URLSearchParams(location.search).get('t') ? '✅' : '❌');
    }
    
    function stopShare() {
      if (mr) mr.stop();
      if (ws) ws.close();
      if (stream) stream.getTracks().forEach(t => t.stop());
      log('🛑 Transmissão parada');
      viewerCountEl.className = 'offline';
      viewerCountEl.textContent = '🔴 Desconectado';
    }
    
    // Auto-refresh viewer count
    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type:'ping'}));
      }
    }, 5000);
    
    log('🟢 Sistema pronto. Clique em Iniciar transmissão');
    statusEl.textContent = '🟢 Pronto para transmitir';
    statusEl.className = 'status ok';
    updateViewerCount(false);
  </script>
</body>
</html>
