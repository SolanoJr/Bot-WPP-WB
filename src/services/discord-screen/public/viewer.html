<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistir</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
    .card { background: #16213e; border-radius: 12px; padding: 24px; max-width: 700px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { margin-bottom: 16px; color: #74c0fc; font-size: 24px; }
    .status { padding: 12px; border-radius: 8px; margin: 12px 0; background: #0f3460; font-size: 14px; }
    .status.error { background: #3d0f0f; color: #ff6b6b; }
    .status.success { background: #0f3d0f; color: #51cf66; }
    .status.info { background: #0f3460; color: #74c0fc; }
    .video-wrap { background: #000; border-radius: 8px; height: 400px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .stats > div { background: #1a1a2e; padding: 8px; border-radius: 6px; text-align: center; }
    .stats strong { display: block; font-size: 18px; color: #74c0fc; }
    .stats span { font-size: 10px; color: #888; }
    .live-badge { display: inline-flex; align-items: center; gap: 6px; background: #dc3545; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
    .live-badge .dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .note { font-size: 12px; color: #888; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👥 Assistindo</h1>
    
    <p id="pageStatus" class="status info">Conectando...</p>
    
    <div id="viewer-setup">
      <div class="video-wrap" id="viewer-empty">Sem preview</div>
    </div>
    
    <div id="viewer-live" hidden>
      <div class="live-badge"><span class="dot"></span> Ao vivo</div>
      <div class="video-wrap">
        <video id="viewer-preview" autoplay muted playsinline></video>
      </div>
      <div class="stats">
        <div><strong id="viewer-fps">—</strong><span>quadros</span></div>
        <div><strong id="viewer-bitrate">—</strong><span>bitrate</span></div>
        <div><strong id="viewer-viewers">0</strong><span>assistindo</span></div>
        <div><strong id="viewer-elapsed">00:00</strong><span>no ar</span></div>
      </div>
    </div>
    
    <p class="note">Se o vídeo não carregar, aguarde alguns segundos ou recarregue a página.</p>
  </div>
  
  <script src="/viewer.js?v=9"></script>
</body>
</html>
