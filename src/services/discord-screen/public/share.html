<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmitir</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #16213e; border-radius: 12px; padding: 32px; width: 90%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { margin-bottom: 16px; color: #e94560; }
    .status { padding: 12px; border-radius: 8px; margin: 16px 0; background: #0f3460; }
    .btn { background: #e94560; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin: 8px 0; }
    .btn:hover { background: #c73652; }
    .btn:disabled { background: #555; cursor: not-allowed; }
    video { width: 100%; border-radius: 8px; margin: 16px 0; background: #000; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    .info { color: #74c0fc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🖥️ Transmitir Tela</h1>
    <div id="status" class="status info">Aguardando...</div>
    <video id="preview" autoplay muted playsinline></video>
    <button id="startBtn" class="btn">Escolher tela e transmitir</button>
    <button id="stopBtn" class="btn" style="display:none">Parar</button>
  </div>
  <script>
    var status = document.getElementById('status');
    var preview = document.getElementById('preview');
    var startBtn = document.getElementById('startBtn');
    var stopBtn = document.getElementById('stopBtn');
    var ws = null;
    var mediaStream = null;
    var recorder = null;
    var isBroadcasting = false;
    
    function log() { console.log('[Share]', ...arguments); }
    function setStatus(text, type) {
      status.textContent = text;
      status.className = 'status ' + (type || '');
    }
    
    // Verificar suporte
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setStatus('❌ Seu navegador não suporta captura de tela. Use Chrome/Edge.', 'error');
      startBtn.disabled = true;
    }
    
    startBtn.onclick = async function() {
      if (isBroadcasting) { stopBroadcast(); return; }
      try {
        setStatus('Solicitando captura de tela...', 'info');
        log('Solicitando captura');
        
        // Solicitar captura com timeout
        var timeout = setTimeout(function() {
          setStatus('❌ Timeout ao solicitar captura. Permita o acesso à tela.', 'error');
        }, 10000);
        
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: 'always' },
          audio: false
        });
        
        clearTimeout(timeout);
        log('Captura iniciada');
        
        preview.srcObject = mediaStream;
        preview.style.display = 'block';
        
        // Verificar se usuário fechou a seleção
        mediaStream.getVideoTracks()[0].onended = function() {
          log('Captura encerrada pelo usuário');
          stopBroadcast();
        };
        
        // Conectar WebSocket
        connectWebSocket();
        
        // Aguardar conexão
        await new Promise(function(resolve) {
          if (ws && ws.readyState === WebSocket.OPEN) return resolve();
          ws.addEventListener('open', function() { resolve(); }, { once: true });
        });
        
        // Iniciar gravação e envio
        var mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
          ? 'video/webm;codecs=vp9' 
          : 'video/webm';
        
        recorder = new MediaRecorder(mediaStream, {
          mimeType: mimeType,
          videoBitsPerSecond: 2500000
        });
        
        recorder.ondataavailable = function(e) {
          if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
            var reader = new FileReader();
            reader.onloadend = function() {
              var base64 = reader.result.split(',')[1];
              ws.send(JSON.stringify({
                type: 'blob-chunk',
                data: base64,
                mimeType: mimeType
              }));
            };
            reader.readAsDataURL(e.data);
          }
        };
        
        recorder.start(1000);
        ws.send(JSON.stringify({type: 'start'}));
        
        isBroadcasting = true;
        startBtn.textContent = 'Parar';
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        setStatus('🔴 Transmitindo!', 'success');
        
      } catch(e) {
        log('Erro:', e.name, e.message);
        setStatus('❌ Erro: ' + e.message, 'error');
      }
    };
    
    function connectWebSocket() {
      var query = new URLSearchParams(location.search);
      var token = query.get('t');
      var proto = location.protocol === 'https:' ? 'wss' : 'ws';
      var wsUrl = proto + '://' + location.host + '/ws?t=' + encodeURIComponent(token) + '&fonte=tela';
      
      log('Conectando em:', wsUrl);
      ws = new WebSocket(wsUrl);
      
      ws.onopen = function() {
        log('WebSocket conectado');
        setStatus('🟢 Conectado ao servidor', 'success');
      };
      
      ws.onmessage = function(e) {
        try { log('Msg:', JSON.parse(e.data).type); } catch(err) {}
      };
      
      ws.onerror = function() {
        log('WebSocket erro');
        setStatus('❌ Erro na conexão', 'error');
      };
      
      ws.onclose = function() {
        log('WebSocket fechado');
        isBroadcasting = false;
        setStatus('⚪ Desconectado', 'info');
      };
    }
    
    function stopBroadcast() {
      isBroadcasting = false;
      try { if(recorder) recorder.stop(); } catch(e) {}
      recorder = null;
      if (mediaStream) {
        mediaStream.getTracks().forEach(function(t) { t.stop(); });
        mediaStream = null;
      }
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type: 'stop'}));
      if (ws) { ws.close(); ws = null; }
      preview.style.display = 'none';
      startBtn.textContent = 'Escolher tela e transmitir';
      startBtn.style.display = 'block';
      stopBtn.style.display = 'none';
      setStatus('⏹️ Parado', 'info');
    }
    
    stopBtn.onclick = stopBroadcast;
  </script>
</body>
</html>
