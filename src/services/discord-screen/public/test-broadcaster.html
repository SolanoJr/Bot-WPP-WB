<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste de Screen Share</title>
  <style>
    body { background: #1a1a2e; color: #eee; font-family: monospace; padding: 20px; }
    .log { background: #16213e; padding: 15px; border-radius: 8px; margin: 10px 0; max-height: 400px; overflow-y: auto; }
    .ok { color: #4ecca3; }
    .error { color: #e74c3c; }
    .warn { color: #f39c12; }
    button { background: #0f3460; color: #eee; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; font-size: 16px; }
    button:hover { background: #1a5276; }
    h1 { color: #4ecca3; }
  </style>
</head>
<body>
  <h1>🔍 Teste de Screen Share</h1>
  <button onclick="startTest()">🚀 Iniciar Teste</button>
  <button onclick="clearLog()">Limpar</button>
  <div id="log" class="log"></div>

  <script>
    const log = document.getElementById('log');
    
    function add(msg, type = 'info') {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = type;
      div.textContent = `[${time}] ${msg}`;
      log.appendChild(div);
      console.log(`[${type}] ${msg}`);
      log.scrollTop = log.scrollHeight;
    }
    
    function clearLog() { log.innerHTML = ''; }
    
    async function startTest() {
      clearLog();
      add('=== TESTE DE SCREEN SHARE ===', 'ok');
      
      // Step 1: Verificar APIs
      add('\n📋 Step 1: Verificando APIs...');
      const apis = {
        'VideoEncoder': typeof window.VideoEncoder !== 'undefined',
        'MediaStreamTrackProcessor': typeof window.MediaStreamTrackProcessor !== 'undefined',
        'getDisplayMedia': !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia),
        'WebSocket': typeof window.WebSocket !== 'undefined'
      };
      
      for (const [name, exists] of Object.entries(apis)) {
        add(`  ${name}: ${exists ? '✅' : '❌'}`, exists ? 'ok' : 'error');
      }
      
      // Step 2: Obter stream
      add('\n📋 Step 2: Obtendo stream de vídeo...');
      add('  Selecione uma tela quando o seletor abrir...');
      
      let stream;
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 },
          audio: false
        });
        
        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings();
        add(`  ✅ Stream: ${settings.width}x${settings.height} @ ${settings.frameRate}fps`, 'ok');
        
        // Step 3: Conectar WebSocket
        add('\n📋 Step 3: Conectando WebSocket...');
        
        const token = new URLSearchParams(location.search).get('t');
        if (!token) {
          add('  ❌ Token não encontrado na URL!', 'error');
          add('  Use o link completo que o bot manda no Discord', 'warn');
          return;
        }
        
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl = `${proto}://${location.host}/ws?t=${encodeURIComponent(token)}&fonte=tela`;
        
        const ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';
        
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            add('  ❌ Timeout na conexão WebSocket!', 'error');
            ws.close();
            reject();
          }, 10000);
          
          ws.onopen = () => {
            add('  ✅ WebSocket conectado!', 'ok');
            clearTimeout(timeout);
            resolve();
          };
          
          ws.onerror = () => {
            add('  ❌ Erro no WebSocket!', 'error');
            clearTimeout(timeout);
            reject();
          };
        });
        
        // Step 4: Enviar config
        add('\n📋 Step 4: Enviando configuração...');
        ws.send(JSON.stringify({type:"config",config:{codec:"vp8",width:settings.width,height:settings.height,bitrate:5000000,framerate:30}}));
        ws.send(JSON.stringify({type:"start"}));
        add('  ✅ Config enviada!', 'ok');
        
        // Step 5: Iniciar transmissão
        add('\n📋 Step 5: Iniciando transmissão...');
        
        // Tentar WebCodecs primeiro
        if (window.VideoEncoder && window.MediaStreamTrackProcessor) {
          add('  Tentando WebCodecs...');
          try {
            const cfg = { codec: 'vp8', width: settings.width, height: settings.height, bitrate: 5000000, framerate: 30 };
            const { supported } = await VideoEncoder.isConfigSupported(cfg);
            
            if (supported) {
              const encoder = new VideoEncoder({
                output: (chunk) => {
                  if (ws.readyState === WebSocket.OPEN) {
                    const data = new Uint8Array(chunk.byteLength);
                    chunk.copyTo(data);
                    ws.send(data);
                  }
                },
                error: (err) => add(`  ❌ Erro no encoder: ${err.message}`, 'error')
              });
              
              encoder.configure(cfg);
              
              const processor = new MediaStreamTrackProcessor({ track });
              const reader = processor.readable.getReader();
              
              add('  ✅ WebCodecs funcionando! Transmitindo...', 'ok');
              
              let frameCount = 0;
              while (ws.readyState === WebSocket.OPEN) {
                const { done, value } = await reader.read();
                if (done) break;
                encoder.encode(value);
                value.close();
                frameCount++;
                if (frameCount % 30 === 0) add(`  Frames transmitidos: ${frameCount}`, 'info');
              }
            }
          } catch (err) {
            add(`  WebCodecs falhou: ${err.message}`, 'warn');
          }
        }
        
        // Fallback: MediaRecorder
        if (ws.readyState === WebSocket.OPEN) {
          add('  Usando MediaRecorder (fallback)...');
          
          const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
            ? 'video/webm;codecs=vp9'
            : 'video/webm;codecs=vp8';
          
          const mediaRecorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: 5000000
          });
          
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) {
              e.data.arrayBuffer().then(buf => ws.send(buf));
            }
          };
          
          mediaRecorder.start(100);
          add('  ✅ MediaRecorder funcionando! Transmitindo...', 'ok');
          
          // Manter transmitindo por 30s
          await new Promise(resolve => setTimeout(resolve, 30000));
          mediaRecorder.stop();
        }
        
        ws.close();
        stream.getTracks().forEach(t => t.stop());
        
        add('\n✅ TESTE CONCLUÍDO!', 'ok');
        
      } catch (err) {
        add(`  ❌ Erro: ${err.name} - ${err.message}`, 'error');
      }
    }
    
    add('Clique em "Iniciar Teste" para começar', 'info');
  </script>
</body>
</html>
